name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # Only the GUI layer and the dev tools: the model runtimes are large,
          # optional, and stubbed out in the tests.
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

      - name: The interface builds
        run: |
          COMPANIONAI_HOME="$RUNNER_TEMP/companionai" python -c "
          from companionai.ui.app import build
          build()
          print('gradio blocks built')
          "

      - name: Readiness report runs offline
        run: COMPANIONAI_HOME="$RUNNER_TEMP/companionai" python -m companionai --doctor || true
