[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "companionai"
version = "0.1.0"
description = "A local AI companion: speech in, speech out, character images, no cloud."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "CompanionAI contributors" }]
keywords = ["llm", "speech", "offline", "raspberry-pi", "jetson", "companion"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]

# The GUI and audio plumbing only.  Every model runtime is an extra so a
# minimal install stays small on an SD card.
dependencies = [
  "gradio>=4.44",
  "numpy>=1.24",
]

[project.optional-dependencies]
# Language model, speech recognition, speech synthesis, microphone.
voice = [
  "llama-cpp-python>=0.3.2",
  "faster-whisper>=1.0.3",
  "piper-tts>=1.2.0",
  "sounddevice>=0.4.6",
  "webrtcvad>=2.0.10",
  "huggingface-hub>=0.24",
]
# Character image generation.  On a Jetson install torch from NVIDIA's wheels
# first and then `pip install --no-deps` the rest of this extra.
image = [
  "torch>=2.1",
  "diffusers>=0.31",
  "transformers>=4.44",
  "accelerate>=0.34",
  "safetensors>=0.4",
  "pillow>=10.0",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]
all = [
  "companionai[voice,image]",
]

[project.scripts]
companionai = "companionai.__main__:main"

[project.urls]
Homepage = "https://github.com/jaredhumphreys3141/COMPANIONAI"

[tool.setuptools.packages.find]
include = ["companionai*"]

[tool.setuptools.package-data]
companionai = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
